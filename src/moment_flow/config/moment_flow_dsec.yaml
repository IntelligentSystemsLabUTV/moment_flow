/moment_flow:
  ros__parameters:
    autostart: true
    iwe_enabled: true              # render the Image of Warped Events (alignment diagnostic / visualization)
    publish_flow_hsv: true       # publish the HSV flow renderings (visualization only)
    events_enabled: true       # publish/save event-supported sparse flow via a warped-event support mask
    debug: false                   # disable debug images/logging/diagnostics-only metrics for lean benchmark runs (flow_dense/flow_tiles and the timing CSV are unaffected)
    max_window_ms: 100.0      # event time span accumulated per flow estimate (one estimate per GT row when saving)
    max_solve_events: 0        # 0 = use every event in the window; no decimation
    num_threads: 0            # threads for the per-event stages; 0 = all available (lower it to bound CPU use on embedded targets)
    num_scales: 6     # tile-pyramid scales; final grid = 2^(N-1) per side (6 -> 32x32 tiles)
    cell_size_px: 4      # moment-grid cell size [px]; larger = more events/cell, stabler fits, coarser
    cell_min_mass: 3.0      # min accumulated event mass for a cell to be considered
    cell_min_lambda: 0.0005      # min dominant eigenvalue of the cell spatial covariance (rejects ill-posed cells)
    cell_max_residual_ratio: 0.95      # max unexplained temporal-variance ratio of the plane fit (0.7: reject noisy fits -> kills random tiles & cuts EPE)

    tile_min_mass: 5.0      # min summed confidence (Σρ) for a tile to be solved from data
    tile_min_cells: 2      # min number of valid cells per tile (5: reject sparse/noisy tiles)
    tile_min_lambda: 0.00001      # min tile geometry eigenvalue (else fall back to prior)
    aperture_ratio: 0.04      # ratio lmin/lmax below which a tile is aperture-limited (tangential taken from prior)
    tikhonov_eps: 0.0005      # Tikhonov regularization coefficient (scaled by the tile's dominant eigenvalue)

    prior_lambda: 0.7      # pull toward the prior (coarser scale / warm-start); high = more stable but shrinks fast motion
    track_enabled: true      # warm-start each window's coarse-to-fine solve with the previous window's tracked field
    reg_lambda: 5.0      # spatial coupling strength of the data-coupled regularizer (0 = exact no-op)
    reg_sweeps: 12      # Gauss-Seidel sweeps for the coupled regularizer (0 = exact no-op)
    reg_sigma: 60.0      # Charbonnier edge-preserving threshold [px/s]; large = nearly isotropic coupling
    smooth_sweeps: 4          # confidence-weighted diffusion sweeps on the composed field (0 = off)
    smooth_beta: 0.5          # neighbour weight of that diffusion (0 = no-op)

    refine_enabled: true      # Stage C: compositional warped re-solve (CMax-style iterations)
    refine_iters: 4           # max warped re-solve iterations (early-stops at sub-pixel residual)
    iwe_scale: 2      # downscale factor for the IWE focus diagnostic (>1 = faster/lower-res; does not affect saved flow)
    max_speed_px_s: 3000.0      # speed clamp [px/s] and upper saturation for the flow visualization
    save_enabled: true        # export the flow as DSEC-format 16-bit PNG
    save_output_dir: /home/neo/workspace/logs/moment_flow/thun_00_a   # output directory for the exported flow PNGs
    save_timestamp_file: /home/neo/workspace/logs/dsec/thun_00_a/optical_flow_forward/thun_00_a_optical_flow_forward_timestamps.txt   # DSEC (from_us, to_us, index) save schedule
    save_clear_output: true   # delete stale PNGs in the output dir before saving
    save_gap_fill: true       # keep solving (and discarding) the windows skipped between non-adjacent scheduled exports, so the tracked field stays fresh
    save_first_index: 2       # first DSEC GT file index to save
    save_index_step: 2        # DSEC GT file index step (matches the 100 ms / 10 Hz GT cadence)
    timing_log_path: /home/neo/workspace/logs/moment_flow/thun_00_a/timing_ms.csv   # end-to-end MomentFlow solve time per window (from_us,to_us,num_events,total_ms)
